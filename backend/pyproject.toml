[project]
name = "mfa-backend"
version = "1.0.0"
description = "Mutual Fund Analytics Backend"
requires-python = ">=3.13"
dependencies = [
    # Core framework
    "fastapi==0.109.2",
    "uvicorn==0.27.1",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    
    # Database
    "sqlmodel==0.0.16",
    "SQLAlchemy==2.0.46",
    
    # CAS parsing
    "casparser==0.5.4",
    "casparser_isin==2025.3.1",
    "pdfminer.six==20211012",
    
    # HTTP / Networking
    "requests==2.32.3",
    "urllib3==2.2.3",
    "charset-normalizer==3.3.2",
    "chardet==5.2.0",
    "httpx==0.27.2",
    
    # Financial calculations
    "pyxirr==0.10.8",
    
    # Data / Utilities
    "pydantic==2.12.5",
    "python-dateutil==2.9.0.post0",
    "RapidFuzz==3.14.3",
    
    # Cryptography
    "cryptography==46.0.5",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.2.2",
    "pytest-mock==3.14.0",
    "pytest-cov==5.0.0",
    "pytest-anyio==0.12.1",
    
    # Code quality
    "ruff==0.8.4",
    "pre-commit==4.0.1",
    "mypy==1.13.0",
    "types-requests==2.32.0.20240914",
]

build = [
    # Build dependencies
    "wheel>=0.44.0",
    "setuptools>=75.0.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "venv",
    "env",
]

indent-width = 4

# Assume Python 3.13
target-version = "py313"

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), isort (`I`), and pyupgrade (`UP`)
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces, rather than tabs
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
